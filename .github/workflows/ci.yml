name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm run setup
      - run: npm test
      - run: npm run lint
      - if: runner.os != 'Windows'
        run: npm run test:race
        env:
          CGO_ENABLED: '1'
      - run: npm audit
      - run: npm audit --prefix web
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: dist/
  real-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run setup && npm run setup:runtime && npm run build:frontend
      - run: go test -run TestInstalledDownloader -count=1 -v ./internal/worker
        env:
          YTDLS_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
  browsers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: npm run setup
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
